services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    # --reload = watches for code changes and reloads (live-reload)
    # --host 0.0.0.0 = exposes it to other containers (and our port map)
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    working_dir: /app

  # The Next.js Frontend Service
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "3000:3000"
    working_dir: /app
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
