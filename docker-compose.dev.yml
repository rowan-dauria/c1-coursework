services:
  # the build context is the root directory so that the fiveD_NN_package directory is found
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: development
    volumes:
      - ./backend:/app
      # Map package for editable install updates if needed
      - ./fiveD_NN_package:/opt/fiveD_NN_package
    # --reload = watches for code changes and reloads (live-reload)
    # --host 0.0.0.0 = exposes it to other containers (and our port map)
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    working_dir: /app
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # The Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "3000:3000"
    working_dir: /app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
